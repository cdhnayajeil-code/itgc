        const TYPE_LABELS = { A: '현업요청', B: '자동처리', C: '관리자작업' };
        const FILTER_MONTH = '2026-08';
        let currentFilter = { type: null, search: '' };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            return dateStr.replace('T', ' ').substring(0, 16);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function filterByType(type) {
            currentFilter.type = currentFilter.type === type ? null : type;
            document.querySelectorAll('.summary-card').forEach(card => {
                card.classList.toggle('active', card.dataset.type === (currentFilter.type || ''));
            });
            applyFilters();
        }

        function applyFilters() {
            currentFilter.search = document.getElementById('searchInput').value.toLowerCase().trim();
            const rows = document.querySelectorAll('#dmlTableBody tr');
            let visibleCount = 0;

            rows.forEach(row => {
                const type = row.dataset.type;
                const searchText = row.dataset.search || '';
                let typeMatch = !currentFilter.type || type === currentFilter.type;
                let searchMatch = !currentFilter.search || searchText.includes(currentFilter.search);

                if (typeMatch && searchMatch) {
                    row.classList.remove('hidden');
                    visibleCount++;
                } else {
                    row.classList.add('hidden');
                }
            });

            document.getElementById('filteredCount').textContent = visibleCount;
            document.getElementById('filterInfo').textContent =
                (currentFilter.type || currentFilter.search) ? `필터 적용: ${visibleCount}/${logs.length}건` : '';
        }

        function clearFilters() {
            currentFilter = { type: null, search: '' };
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.summary-card').forEach(card => card.classList.remove('active'));
            applyFilters();
        }

        function showDocDetail(docNo) {
            switchTab('approval');
            document.querySelectorAll('#docTableBody tr').forEach(row => {
                row.classList.toggle('highlight', row.dataset.docno === docNo);
                if (row.dataset.docno === docNo) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        function showSqlDetail(idx) {
            const log = logs[idx];
            if (!log) return;
            
            let userDisplay = log.login_name || '-';
            if (log.type === 'A' && log.docNo) {
                const linkedDoc = docs.find(d => d.docNo === log.docNo);
                if (linkedDoc?.requester) userDisplay = linkedDoc.requester;
            }
            
            document.getElementById('modalDate').textContent = formatDate(log.event_time_kst);
            document.getElementById('modalUser').textContent = userDisplay;
            document.getElementById('modalType').textContent = TYPE_LABELS[log.type] || log.type;
            document.getElementById('modalReason').textContent = log.reason || '-';
            document.getElementById('modalDocNo').textContent = log.docNo || '-';
            document.getElementById('modalSql').textContent = log.sql_text || '(SQL 없음)';
            document.getElementById('sqlModal').classList.add('show');
        }

        function closeSqlModal() {
            document.getElementById('sqlModal').classList.remove('show');
        }

        function renderTables() {
            const countA = logs.filter(l => l.type === 'A').length;
            const countB = logs.filter(l => l.type === 'B').length;
            const countC = logs.filter(l => l.type === 'C').length;
            document.getElementById('countA').textContent = countA;
            document.getElementById('countB').textContent = countB;
            document.getElementById('countC').textContent = countC;
            document.getElementById('countTotal').textContent = logs.length;

            const dmlBody = document.getElementById('dmlTableBody');
            dmlBody.innerHTML = logs.map((log, idx) => {
                const globalIndex = logs.length - idx;
                const badgeClass = log.type === 'A' ? 'badge-a' : log.type === 'B' ? 'badge-b' : 'badge-c';
                const typeLabel = TYPE_LABELS[log.type] || log.type;

                let userDisplay = log.login_name || '-';
                if (log.type === 'A' && log.docNo) {
                    const linkedDoc = docs.find(d => d.docNo === log.docNo);
                    if (linkedDoc?.requester) userDisplay = linkedDoc.requester;
                }

                // 문서번호 축약 표시 (더 길게 표시)
                const docNoShort = log.docNo ? (log.docNo.length > 42 ? log.docNo.substring(0, 39) + '...' : log.docNo) : '-';
                const docNoHtml = log.docNo && log.docNo.includes('-')
                    ? `<a class="doc-link" onclick="showDocDetail('${escapeHtml(log.docNo)}')" title="${escapeHtml(log.docNo)}">${escapeHtml(docNoShort)}</a>`
                    : `<span class="text-muted">-</span>`;

                const sqlPreview = (log.sql_text || '').substring(0, 60) + ((log.sql_text?.length > 60) ? '...' : '');
                const searchData = [log.docNo, log.reason, log.sql_text, log.login_name].join(' ').toLowerCase();

                return `<tr data-id="${log.id}" data-type="${log.type}" data-search="${escapeHtml(searchData)}">
                    <td class="text-center">${globalIndex}</td>
                    <td class="text-center font-mono">${formatDate(log.event_time_kst)}</td>
                    <td class="text-center">${escapeHtml(userDisplay)}</td>
                    <td class="text-center"><span class="badge ${badgeClass}">${typeLabel}</span></td>
                    <td title="${escapeHtml(log.docNo || '')}">${docNoHtml}</td>
                    <td title="${escapeHtml(log.reason || '')}"><span class="cell-truncate">${escapeHtml(log.reason || '-')}</span></td>
                    <td class="font-mono" title="${escapeHtml(log.sql_text || '')}"><span class="cell-truncate">${escapeHtml(sqlPreview)}</span></td>
                    <td class="text-left"><button class="btn-view" onclick="showSqlDetail(${idx})">View</button></td>
                </tr>`;
            }).join('');

            const docBody = document.getElementById('docTableBody');
            docBody.innerHTML = docs.map((doc, idx) => {
                const urlLink = doc.url ? `<a href="${escapeHtml(doc.url)}" target="_blank" class="doc-link" style="display:inline;">🔗</a>` : '-';
                const docNoShort = doc.docNo ? (doc.docNo.length > 38 ? doc.docNo.substring(0, 35) + '...' : doc.docNo) : '-';
                return `<tr data-docno="${escapeHtml(doc.docNo)}">
                    <td class="text-center">${idx + 1}</td>
                    <td class="text-center">${escapeHtml(doc.date)}</td>
                    <td class="text-center">${escapeHtml(doc.requester)}</td>
                    <td title="${escapeHtml(doc.docNo)}"><strong class="cell-truncate">${escapeHtml(docNoShort)}</strong></td>
                    <td title="${escapeHtml(doc.title || '')}"><span class="cell-truncate">${escapeHtml(doc.title || '-')}</span></td>
                    <td class="text-center">${escapeHtml(doc.tableName || '-')}</td>
                    <td class="text-center">${escapeHtml(doc.operation || '-')}</td>
                    <td class="text-center">${urlLink}</td>
                </tr>`;
            }).join('');

            applyFilters();
        }

        function exportToExcel() {
            const visibleLogs = logs.filter(log => {
                const row = document.querySelector(`#dmlTableBody tr[data-id="${log.id}"]`);
                return row && !row.classList.contains('hidden');
            });

            const data = visibleLogs.map((log, idx) => {
                let userDisplay = log.login_name;
                if (log.type === 'A' && log.docNo) {
                    const linkedDoc = docs.find(d => d.docNo === log.docNo);
                    if (linkedDoc?.requester) userDisplay = linkedDoc.requester;
                }
                return {
                    '순번': idx + 1,
                    '일시': log.event_time_kst,
                    '요청자': userDisplay,
                    '구분': TYPE_LABELS[log.type] || log.type,
                    '문서번호': log.docNo,
                    '변경사유': log.reason,
                    'SQL': log.sql_text,
                    'IP': log.client_net_address
                };
            });
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'DML_Report');
            XLSX.writeFile(wb, `DML_Report_${FILTER_MONTH}.xlsx`);
        }

        renderTables();
    </script>
</body>
</html>
