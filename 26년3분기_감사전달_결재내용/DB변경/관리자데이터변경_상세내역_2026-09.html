        const OP_LABELS = { INSERT: '추가', UPDATE: '수정', DELETE: '삭제' };
        const FILTER_MONTH = '2026-09';
        let currentFilter = { op: null, search: '' };

        function escapeHtml(str){ if(!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function formatDate(s){ if(!s) return '-'; return s.replace('T',' ').substring(0,16); }
        function opBadge(op){ const c = op==='INSERT'?'badge-ins':op==='DELETE'?'badge-del':'badge-upd'; return `<span class="badge ${c}">${OP_LABELS[op]||op}</span>`; }

        function formatSql(sql){
            if(!sql) return '';
            const kw=['SELECT','FROM','WHERE','AND','OR','INSERT','INTO','VALUES','UPDATE','SET','DELETE','JOIN','LEFT','RIGHT','INNER','OUTER','ON','ORDER BY','GROUP BY','HAVING','EXEC','EXECUTE','BEGIN','END','DECLARE'];
            let f=sql.trim();
            kw.forEach(k=>{ f=f.replace(new RegExp('\\s+('+k+')\\s+','gi'),'\n'+k+' '); });
            f=f.replace(/,\s*/g,',\n    ').replace(/^\n+/,'');
            return f;
        }

        function filterByOp(op){
            currentFilter.op = currentFilter.op === op ? null : op;
            document.querySelectorAll('.summary-card').forEach(card=>{
                card.classList.toggle('active', card.dataset.op === (currentFilter.op||''));
            });
            applyFilters();
        }

        function applyFilters(){
            currentFilter.search = document.getElementById('searchInput').value.toLowerCase().trim();
            const rows = document.querySelectorAll('#adminTableBody tr');
            let visible = 0;
            rows.forEach(row=>{
                const op = row.dataset.op;
                const searchText = row.dataset.search || '';
                const opMatch = !currentFilter.op || op === currentFilter.op;
                const searchMatch = !currentFilter.search || searchText.includes(currentFilter.search);
                if(opMatch && searchMatch){ row.classList.remove('hidden'); visible++; }
                else { row.classList.add('hidden'); }
            });
            document.getElementById('filteredCount').textContent = visible;
            document.getElementById('filterInfo').textContent =
                (currentFilter.op || currentFilter.search) ? `필터 적용: ${visible}/${ADMIN_LOGS.length}건` : '';
        }

        function clearFilters(){
            currentFilter = { op:null, search:'' };
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.summary-card').forEach(card=>card.classList.toggle('active', card.dataset.op===''));
            applyFilters();
        }

        function showSqlDetail(idx){
            const log = ADMIN_LOGS[idx];
            if(!log) return;
            document.getElementById('modalDate').textContent = formatDate(log.time);
            document.getElementById('modalUser').textContent = log.user || '-';
            document.getElementById('modalOp').textContent = OP_LABELS[log.op] || log.op;
            document.getElementById('modalTable').textContent = log.tableName || '-';
            document.getElementById('modalReason').textContent = log.reason || '-';
            document.getElementById('modalDocNo').textContent = log.docNo || '-';
            document.getElementById('modalSql').textContent = formatSql(log.sql) || '(SQL 없음)';
            document.getElementById('sqlModal').classList.add('show');
        }
        function closeSqlModal(){ document.getElementById('sqlModal').classList.remove('show'); }

        function renderTable(){
            const body = document.getElementById('adminTableBody');
            body.innerHTML = ADMIN_LOGS.map((log, idx)=>{
                const docNoShort = log.docNo ? (log.docNo.length>42 ? log.docNo.substring(0,39)+'...' : log.docNo) : '-';
                const docNoHtml = log.docNo
                    ? `<span class="cell-truncate font-mono" title="${escapeHtml(log.docNo)}">${escapeHtml(docNoShort)}</span>`
                    : '<span class="text-muted">-</span>';
                const sqlPreview = (log.sql||'').replace(/\s+/g,' ').substring(0,70) + ((log.sql||'').length>70?'...':'');
                const searchData = [log.user, log.tableName, log.docNo, log.reason, log.sql].join(' ').toLowerCase();
                return `<tr data-id="${escapeHtml(log.id)}" data-op="${log.op}" data-search="${escapeHtml(searchData)}" title="${escapeHtml(sqlPreview)}">
                    <td class="text-center">${idx+1}</td>
                    <td class="text-center font-mono">${formatDate(log.time)}</td>
                    <td class="text-center">${escapeHtml(log.user||'-')}</td>
                    <td class="text-center">${opBadge(log.op)}</td>
                    <td class="font-mono"><span class="cell-truncate" title="${escapeHtml(log.tableName)}">${escapeHtml(log.tableName)}</span></td>
                    <td>${docNoHtml}</td>
                    <td title="${escapeHtml(log.reason)}"><span class="cell-truncate">${escapeHtml(log.reason||'-')}</span></td>
                    <td class="text-center"><button class="btn-view" onclick="showSqlDetail(${idx})">View</button></td>
                </tr>`;
            }).join('') || '<tr><td colspan="8" class="text-center" style="padding:16px;color:#999;">데이터 없음</td></tr>';
            applyFilters();
        }

        function exportToExcel(){
            const visible = ADMIN_LOGS.filter(log=>{
                const row = document.querySelector(`#adminTableBody tr[data-id="${log.id}"]`);
                return row && !row.classList.contains('hidden');
            });
            const data = visible.map((log, idx)=>({
                '순번': idx+1,
                '변경일시': log.time,
                '데이터관리자': log.user,
                '작업': OP_LABELS[log.op] || log.op,
                '대상 테이블': log.tableName,
                '결재문서': log.docNo,
                '변경사유': log.reason,
                'SQL': log.sql
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '관리자데이터변경');
            XLSX.writeFile(wb, `관리자데이터변경_상세내역_${FILTER_MONTH}.xlsx`);
        }

        renderTable();
    </script>
